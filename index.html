<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Necessidades de TI 2027 · GPSC/ATI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#102A43; --navy2:#1B3A5C; --teal:#0EA5A8; --teal-soft:#E6F7F7; --bg:#F3F6FA; --card:#FFFFFF;
    --text:#243B53; --muted:#627D98; --line:#D9E2EC; --amber:#F5B400; --green:#7AC143; --red:#D64545;
    --radius:16px; --shadow:0 6px 24px rgba(16,42,67,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Roboto,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  .app{min-height:100vh;display:flex;flex-direction:column}
  header{background:#fff;border-bottom:1px solid var(--line)}
  .bar{max-width:680px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
  .bar img{height:34px;width:auto;display:block}
  .bar .sep{width:1px;height:28px;background:var(--line)}
  .bar .tag{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
  .progress{height:4px;background:var(--line)}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),#14C4C7);transition:width .35s ease}
  main{flex:1;width:100%;max-width:680px;margin:0 auto;padding:20px 16px 120px}
  .screen{animation:in .28s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
  h1{font-size:clamp(26px,6vw,36px);line-height:1.15;margin:10px 0 12px;color:var(--navy);font-weight:800;letter-spacing:-.02em}
  h2{font-size:22px;margin:6px 0 4px;color:var(--navy);font-weight:800;letter-spacing:-.01em}
  p.lead{font-size:17px;line-height:1.5;color:var(--muted);margin:0 0 22px}
  .hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:22px;padding:28px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .hero h1{color:#fff}
  .hero p.lead{color:#D9EDF5}
  .hero .dots{position:absolute;right:18px;top:18px;display:flex;gap:6px}
  .hero .dots span{width:10px;height:10px;border-radius:3px}
  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
  .fact{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 10px;text-align:center}
  .fact b{display:block;font-size:20px}
  .fact span{font-size:12px;color:#BFD6E6}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;font-size:16px;outline:none;transition:border-color .15s, box-shadow .15s}
  .field textarea{min-height:120px;resize:vertical}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(14,165,168,.15)}
  .locked{display:flex;align-items:center;gap:10px;background:var(--teal-soft);border:1px solid #BCE7E8;border-radius:12px;padding:12px 14px;font-weight:700;color:var(--navy)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .err{background:#FEECEC;border:1px solid #F5C2C2;color:#8A1C1C;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px;display:none}
  .catHead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
  .count{font-size:13px;color:var(--muted);white-space:nowrap}
  .count b{color:var(--teal)}
  .item{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;transition:border-color .15s, box-shadow .15s}
  .item.on{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,165,168,.12)}
  .item .t{font-weight:700;color:var(--navy);font-size:16px}
  .item .d{font-size:13px;color:var(--muted);margin:2px 0 12px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
  .opt:hover{border-color:var(--teal)}
  .opt:focus-visible{outline:3px solid rgba(14,165,168,.35);outline-offset:2px}
  .opt.sel{background:var(--teal);border-color:var(--teal);color:#fff}
  .opt.no.sel{background:#EDEFF2;border-color:#C9D3DE;color:var(--muted)}
  .footer{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  .footer .in{max-width:680px;margin:0 auto;padding:12px 16px;display:flex;gap:10px;align-items:center}
  .btn{min-height:50px;border:0;border-radius:14px;padding:0 22px;font-weight:700;font-size:16px;cursor:pointer;transition:transform .08s, background .15s}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--navy);color:#fff;flex:1}
  .btn.primary:hover{background:var(--navy2)}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
  .btn[disabled]{opacity:.6;cursor:wait}
  .step{font-size:12px;color:var(--muted);text-align:center;padding:0 0 8px}
  .sum{list-style:none;margin:0;padding:0}
  .sum li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
  .sum li:last-child{border-bottom:0}
  .sum .r{font-weight:700;color:var(--teal);white-space:nowrap}
  .sumGroup{margin-bottom:14px}
  .sumGroup h3{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--navy);margin:0 0 6px}
  .link{background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer;font-size:14px;padding:6px 0}
  .empty{color:var(--muted);font-size:14px;padding:6px 0}
  .done{text-align:center;padding:30px 10px}
  .check{width:76px;height:76px;border-radius:50%;background:var(--teal);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(14,165,168,.35);animation:pop .4s ease}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  .legal{font-size:12px;color:var(--muted);text-align:center;margin-top:26px;line-height:1.5}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes r{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
  // Endereço do app publicado no Apps Script (termina em /exec)
  const API_URL = 'https://script.google.com/macros/s/AKfycbxksl7xEwkcKQMpyOJaQmCw_iyLLgZTIxfHiB_kBZyBPwCYhMu9RqYyOEW6Tw9QdnSpeg/exec';
  let DADOS = null;
</script>
<script>
function iniciarApp() {
  const CATS = ['Hardware', 'Software', 'Serviços'];
  const CAT_TXT = {
    Hardware: 'Marque a quantidade aproximada para os próximos 12 meses.',
    Software: 'Marque a quantidade aproximada de licenças para os próximos 12 meses.',
    'Serviços': 'Marque os serviços que seu órgão pretende contratar.'
  };
  const S = {
    tela: 'inicio', cat: 0, voltarRevisao: false,
    org: DADOS.orgFixo || '', orgOutro: '', nome: '', email: '', telefone: '', outros: '', website: '',
    resp: {}
  };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const itensDa = (cat) => DADOS.catalogo.filter(i => i.cat === cat);
  const marcados = () => DADOS.catalogo.filter(i => S.resp[i.cod]);
  const ordem = ['inicio', 'id', 'cat0', 'cat1', 'cat2', 'outros', 'revisao', 'fim'];

  function progresso() {
    const k = S.tela === 'cat' ? 'cat' + S.cat : S.tela;
    const i = Math.max(0, ordem.indexOf(k));
    $('prog').style.width = Math.round(i / (ordem.length - 1) * 100) + '%';
  }

  function nav(html) { $('nav').innerHTML = html; $('footer').style.display = html ? '' : 'none'; }

  function ir(tela, cat) {
    S.tela = tela; if (cat !== undefined) S.cat = cat;
    render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function render() {
    progresso();
    const m = $('main');
    if (S.tela === 'inicio') {
      m.innerHTML = `
        <section class="screen">
          <div class="hero">
            <div class="dots"><span style="background:var(--amber)"></span><span style="background:var(--green)"></span><span style="background:var(--red)"></span></div>
            <div class="eyebrow" style="color:#7FDCDD">GPSC · ATI</div>
            <h1>Do que a TI do seu órgão vai precisar em 2027?</h1>
            <p class="lead">Marque os itens e a quantidade aproximada. As respostas de todos os órgãos ajudam a formar Atas de Registro de Preços Corporativas para o Estado.</p>
            <div class="facts">
              <div class="fact"><b>2 min</b><span>para responder</span></div>
              <div class="fact"><b>${DADOS.catalogo.length}</b><span>itens sugeridos</span></div>
              <div class="fact"><b>0</b><span>login ou cadastro</span></div>
            </div>
          </div>
          <p class="legal">Levantamento conduzido pela Gerência de Planejamento de Soluções Corporativas de TI (GPSC) da ATI.<br>Informações estimativas e não vinculantes.</p>
        </section>`;
      nav(`<button class="btn primary" id="go">Começar</button>`);
      $('go').onclick = () => ir('id');
    }

    else if (S.tela === 'id') {
      const orgCampo = DADOS.orgFixo
        ? `<div class="locked">🏛️ ${esc(DADOS.orgFixo)}</div>`
        : `<select id="org" aria-label="Órgão ou entidade">
             <option value="">Selecione</option>
             ${DADOS.orgaos.map(o => `<option ${S.org === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
             <option value="Outro" ${S.org === 'Outro' ? 'selected' : ''}>Outro órgão ou entidade</option>
           </select>`;
      m.innerHTML = `
        <section class="screen">
          <div class="eyebrow">Etapa 1 de 4</div>
          <h2>Quem está respondendo?</h2>
          <p class="lead" style="font-size:15px">Uma resposta por órgão. Se você reenviar, a resposta anterior é substituída.</p>
          <div class="card">
            <div class="err" id="err"></div>
            <div class="field"><label for="org">Órgão ou entidade</label>${orgCampo}</div>
            <div class="field" id="boxOutro" style="display:${S.org === 'Outro' ? 'block' : 'none'}">
              <label for="orgOutro">Qual órgão ou entidade?</label>
              <input id="orgOutro" value="${esc(S.orgOutro)}" placeholder="Sigla e nome">
            </div>
            <div class="field"><label for="nome">Seu nome</label><input id="nome" autocomplete="name" value="${esc(S.nome)}"></div>
            <div class="field"><label for="email">E-mail institucional</label><input id="email" type="email" autocomplete="email" inputmode="email" value="${esc(S.email)}"></div>
            <div class="field"><label for="telefone">Telefone ou WhatsApp <span style="color:var(--muted);font-weight:400">(opcional)</span></label><input id="telefone" type="tel" autocomplete="tel" inputmode="tel" value="${esc(S.telefone)}"></div>
            <div class="hint">Seus dados serão usados apenas para contato sobre este levantamento.</div>
            <div class="hp" aria-hidden="true"><input id="website" tabindex="-1" autocomplete="off"></div>
          </div>
        </section>`;
      const sel = $('org');
      if (sel) sel.onchange = () => { S.org = sel.value; $('boxOutro').style.display = sel.value === 'Outro' ? 'block' : 'none'; };
      nav(`<button class="btn ghost" id="back">Voltar</button><button class="btn primary" id="next">Continuar</button>`);
      $('back').onclick = () => { salvarId(); ir('inicio'); };
      $('next').onclick = () => {
        salvarId();
        const e = validarId();
        if (e) { const b = $('err'); b.textContent = e; b.style.display = 'block'; return; }
        S.voltarRevisao ? ir('revisao') : ir('cat', 0);
      };
    }

    else if (S.tela === 'cat') {
      const cat = CATS[S.cat];
      const lista = itensDa(cat);
      const servico = cat === 'Serviços';
      const opcoes = servico ? ['Precisa'] : DADOS.faixas;
      m.innerHTML = `
        <section class="screen">
          <div class="eyebrow">Etapa ${S.cat + 2} de 4</div>
          <div class="catHead">
            <div><h2>${cat}</h2><div style="color:var(--muted);font-size:14px">${CAT_TXT[cat]}</div></div>
            <div class="count" id="cnt"></div>
          </div>
          ${lista.map(i => `
            <div class="item ${S.resp[i.cod] ? 'on' : ''}" id="it-${i.cod}">
              <div class="t">${esc(i.item)}</div>
              <div class="d">${esc(i.desc)}</div>
              <div class="opts" role="group" aria-label="${esc(i.item)}">
                <button class="opt no ${!S.resp[i.cod] ? 'sel' : ''}" data-cod="${i.cod}" data-v="" aria-pressed="${!S.resp[i.cod]}">Não precisa</button>
                ${opcoes.map(o => `<button class="opt ${S.resp[i.cod] === o ? 'sel' : ''}" data-cod="${i.cod}" data-v="${esc(o)}" aria-pressed="${S.resp[i.cod] === o}">${esc(o)}</button>`).join('')}
              </div>
            </div>`).join('')}
        </section>`;
      const contar = () => {
        const n = lista.filter(i => S.resp[i.cod]).length;
        $('cnt').innerHTML = `<b>${n}</b> de ${lista.length} marcados`;
      };
      contar();
      m.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const cod = b.dataset.cod, v = b.dataset.v;
        if (v) S.resp[cod] = v; else delete S.resp[cod];
        const box = $('it-' + cod);
        box.classList.toggle('on', !!v);
        box.querySelectorAll('.opt').forEach(x => {
          const s = x.dataset.v === v; x.classList.toggle('sel', s); x.setAttribute('aria-pressed', s);
        });
        contar();
      });
      const ult = S.cat === CATS.length - 1;
      nav(`<button class="btn ghost" id="back">Voltar</button><button class="btn primary" id="next">${S.voltarRevisao ? 'Revisar' : ult ? 'Continuar' : 'Próximo: ' + CATS[S.cat + 1]}</button>`);
      $('back').onclick = () => S.cat === 0 ? ir('id') : ir('cat', S.cat - 1);
      $('next').onclick = () => S.voltarRevisao ? ir('revisao') : ult ? ir('outros') : ir('cat', S.cat + 1);
    }

    else if (S.tela === 'outros') {
      m.innerHTML = `
        <section class="screen">
          <div class="eyebrow">Etapa 4 de 4</div>
          <h2>Algo mais?</h2>
          <p class="lead" style="font-size:15px">Algum outro item de TI que seu órgão vai contratar em 2027 e não estava na lista? Opcional.</p>
          <div class="card">
            <div class="field" style="margin:0">
              <label for="outros">Outros itens</label>
              <textarea id="outros" placeholder="Ex.: 20 tablets para fiscalização; renovação de licenças de software de georreferenciamento">${esc(S.outros)}</textarea>
            </div>
          </div>
        </section>`;
      nav(`<button class="btn ghost" id="back">Voltar</button><button class="btn primary" id="next">Revisar</button>`);
      $('back').onclick = () => { S.outros = $('outros').value; ir('cat', CATS.length - 1); };
      $('next').onclick = () => { S.outros = $('outros').value; ir('revisao'); };
    }

    else if (S.tela === 'revisao') {
      S.voltarRevisao = true;
      const orgTxt = S.org === 'Outro' ? S.orgOutro : S.org;
      m.innerHTML = `
        <section class="screen">
          <div class="eyebrow">Revisão</div>
          <h2>Confira antes de enviar</h2>
          <p class="lead" style="font-size:15px">${marcados().length} item(ns) marcado(s) por <b style="color:var(--navy)">${esc(orgTxt)}</b>.</p>
          <div class="card">
            <div class="err" id="err"></div>
            <div class="sumGroup">
              <h3>Responsável <button class="link" data-ir="id">Editar</button></h3>
              <div style="font-size:15px">${esc(S.nome)} · ${esc(S.email)}${S.telefone ? ' · ' + esc(S.telefone) : ''}</div>
            </div>
            ${CATS.map((c, k) => {
              const l = itensDa(c).filter(i => S.resp[i.cod]);
              return `<div class="sumGroup">
                <h3>${c} <button class="link" data-cat="${k}">Editar</button></h3>
                ${l.length ? `<ul class="sum">${l.map(i => `<li><span>${esc(i.item)}</span><span class="r">${esc(S.resp[i.cod])}</span></li>`).join('')}</ul>`
                           : `<div class="empty">Nenhum item marcado</div>`}
              </div>`;
            }).join('')}
            <div class="sumGroup" style="margin:0">
              <h3>Outros itens <button class="link" data-ir="outros">Editar</button></h3>
              <div class="${S.outros.trim() ? '' : 'empty'}" style="font-size:15px;white-space:pre-wrap">${S.outros.trim() ? esc(S.outros) : 'Nenhum'}</div>
            </div>
          </div>
        </section>`;
      m.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => ir('cat', +b.dataset.cat));
      m.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => ir(b.dataset.ir));
      nav(`<button class="btn primary" id="send">Enviar resposta</button>`);
      $('send').onclick = enviar;
    }

    else if (S.tela === 'fim') {
      const n = marcados().length;
      m.innerHTML = `
        <section class="screen done">
          <div class="check"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
          <h1 style="font-size:30px">Resposta registrada</h1>
          <p class="lead">Obrigado! ${n ? `Recebemos ${n} item(ns) de ${esc(S.org === 'Outro' ? S.orgOutro : S.org)}.` : 'Registramos que seu órgão não marcou itens do catálogo.'}<br>${S.reenvio ? 'Esta resposta substituiu a anterior.' : 'Se precisar corrigir, basta responder novamente: a última resposta vale.'}</p>
          <button class="btn ghost" id="again">Revisar ou corrigir</button>
          <p class="legal">GPSC · Gerência de Planejamento de Soluções Corporativas de TI · ATI</p>
        </section>`;
      nav('');
      $('again').onclick = () => ir('revisao');
    }
  }

  function salvarId() {
    if (!DADOS.orgFixo && $('org')) S.org = $('org').value;
    if ($('orgOutro')) S.orgOutro = $('orgOutro').value.trim();
    S.nome = $('nome').value.trim();
    S.email = $('email').value.trim();
    S.telefone = $('telefone').value.trim();
    S.website = $('website').value;
  }

  function validarId() {
    if (!S.org) return 'Selecione o órgão ou entidade.';
    if (S.org === 'Outro' && !S.orgOutro) return 'Informe qual é o órgão ou entidade.';
    if (!S.nome) return 'Informe seu nome.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email)) return 'Informe um e-mail válido.';
    return '';
  }

  function enviar() {
    const btn = $('send');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Enviando…';
    const payload = {
      org: S.org, orgOutro: S.orgOutro, nome: S.nome, email: S.email, telefone: S.telefone,
      outros: S.outros, website: S.website,
      itens: Object.keys(S.resp).map(cod => ({ cod: cod, resp: S.resp[cod] }))
    };
    google.script.run
      .withSuccessHandler(r => { S.reenvio = r && r.reenvio; S.voltarRevisao = true; ir('fim'); })
      .withFailureHandler(e => {
        btn.disabled = false; btn.textContent = 'Enviar resposta';
        const b = $('err'); b.textContent = (e && e.message) || 'Não foi possível enviar. Tente novamente.'; b.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .enviar(payload);
  }

  render();
}

const PARAM_ORG = new URLSearchParams(location.search).get('org') || '';

function telaCarregando(msg, erro) {
  document.getElementById('main').innerHTML = `
    <section class="screen" style="text-align:center;padding:60px 10px">
      ${erro ? '' : '<div class="check" style="background:var(--navy);animation:none"><span class="spin" style="width:28px;height:28px;border-width:3px;margin:0"></span></div>'}
      <p class="lead">${msg}</p>
      ${erro ? '<button class="btn primary" style="flex:none" onclick="carregar()">Tentar novamente</button>' : ''}
    </section>`;
  document.getElementById('footer').style.display = 'none';
}

function carregar() {
  telaCarregando('Carregando…');
  fetch(API_URL + '?api=dados&org=' + encodeURIComponent(PARAM_ORG), { credentials: 'omit', redirect: 'follow' })
    .then(r => r.json())
    .then(d => { DADOS = d; iniciarApp(); })
    .catch(() => telaCarregando('Não foi possível carregar o levantamento. Verifique a conexão e tente novamente.', true));
}

// Substitui google.script.run: envia por POST sem credenciais (evita o erro de várias contas Google)
window.google = { script: { run: (function () {
  let ok = null, falha = null;
  const api = {
    withSuccessHandler(f) { ok = f; return api; },
    withFailureHandler(f) { falha = f; return api; },
    enviar(payload) {
      fetch(API_URL, {
        method: 'POST', credentials: 'omit', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
        .then(r => r.json())
        .then(res => res && res.ok ? ok && ok(res) : falha && falha(new Error((res && res.erro) || 'Não foi possível enviar.')))
        .catch(() => falha && falha(new Error('Falha de conexão. Tente novamente.')));
    }
  };
  return api;
})() } };

carregar();
</script>
</body>
</html>
